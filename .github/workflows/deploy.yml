name: deploy

# Builds the OpenNext Worker and deploys it to personalsite-cms-preview, which
# serves ariaxhan.com. Same command as a local deploy: npm run cf:deploy.
# Pushes by github-actions[bot] do not trigger push workflows, so the motion
# refresh calls this workflow directly after it commits.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          # npm 11 (Node 24) matches the lockfile; npm 10 rejects it as out of sync.
          node-version: 24
          cache: npm


      - run: npm ci

      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy

      - name: Verify live
        run: |
          set -euo pipefail
          want=$(node -p "require('./app/utils/motionData.json').generated")
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS "https://ariaxhan.com/api/stats.json?cb=$GITHUB_RUN_ID-$i" | node -p "JSON.parse(require('fs').readFileSync(0)).motion.generated")
            [ "$got" = "$want" ] && { echo "live generated=$got"; exit 0; }
            sleep 10
          done
          echo "live generated=$got, expected $want" >&2
          exit 1
