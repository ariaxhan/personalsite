<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Four identical letter plates in a row, each with a different arrangement of interior text bars, above a scheduled-time mark">
  <defs>
    <!-- Paper grain. Low opacity so it reads as stock, not noise. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <!-- The one warm glow: the sheet currently being written. -->
    <radialGradient id="lit" cx="50%" cy="52%" r="58%">
      <stop offset="0%" stop-color="#f7edd8"/>
      <stop offset="100%" stop-color="#d3a04a"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="#f3e6cd"/>

  <!-- ================= plate 1 ================= -->
  <g>
    <rect x="150" y="230" width="200" height="270" fill="#f7edd8" stroke="#c06a3e" stroke-width="9"/>
    <rect x="150" y="230" width="200" height="52" fill="#4d6a72"/>
    <rect x="176" y="248" width="60" height="7" fill="#f7edd8"/>
    <g fill="#4a2b23">
      <rect x="176" y="312" width="148" height="9"/>
      <rect x="176" y="338" width="118" height="9"/>
      <rect x="176" y="364" width="140" height="9"/>
    </g>
    <rect x="176" y="400" width="92" height="9" fill="#5c6f4f"/>
    <g fill="#4a2b23">
      <rect x="176" y="432" width="130" height="9"/>
      <rect x="176" y="458" width="74" height="9"/>
    </g>
  </g>

  <!-- ================= plate 2 ================= -->
  <g>
    <rect x="400" y="230" width="200" height="270" fill="#f7edd8" stroke="#c06a3e" stroke-width="9"/>
    <rect x="400" y="230" width="200" height="52" fill="#4d6a72"/>
    <rect x="426" y="248" width="60" height="7" fill="#f7edd8"/>
    <g fill="#4a2b23">
      <rect x="426" y="312" width="112" height="9"/>
      <rect x="426" y="338" width="148" height="9"/>
    </g>
    <rect x="426" y="374" width="108" height="9" fill="#5c6f4f"/>
    <g fill="#4a2b23">
      <rect x="426" y="406" width="136" height="9"/>
      <rect x="426" y="432" width="96" height="9"/>
      <rect x="426" y="458" width="126" height="9"/>
    </g>
  </g>

  <!-- ============ plate 3, lit from within ============ -->
  <g>
    <rect x="650" y="230" width="200" height="270" fill="url(#lit)" stroke="#c06a3e" stroke-width="9"/>
    <rect x="650" y="230" width="200" height="52" fill="#4d6a72"/>
    <rect x="676" y="248" width="60" height="7" fill="#f7edd8"/>
    <g fill="#4a2b23">
      <rect x="676" y="312" width="140" height="9"/>
      <rect x="676" y="338" width="86" height="9"/>
      <rect x="676" y="364" width="128" height="9"/>
    </g>
    <rect x="676" y="400" width="118" height="9" fill="#5c6f4f"/>
    <g fill="#4a2b23">
      <rect x="676" y="432" width="104" height="9"/>
      <rect x="676" y="458" width="142" height="9"/>
    </g>
  </g>

  <!-- ================= plate 4 ================= -->
  <g>
    <rect x="900" y="230" width="200" height="270" fill="#f7edd8" stroke="#c06a3e" stroke-width="9"/>
    <rect x="900" y="230" width="200" height="52" fill="#4d6a72"/>
    <rect x="926" y="248" width="60" height="7" fill="#f7edd8"/>
    <g fill="#4a2b23">
      <rect x="926" y="312" width="126" height="9"/>
      <rect x="926" y="338" width="146" height="9"/>
      <rect x="926" y="364" width="98" height="9"/>
      <rect x="926" y="390" width="134" height="9"/>
    </g>
    <rect x="926" y="426" width="84" height="9" fill="#5c6f4f"/>
    <rect x="926" y="458" width="118" height="9" fill="#4a2b23"/>
  </g>

  <!-- The schedule: one rail, four identical ticks, evenly spaced. -->
  <rect x="150" y="566" width="950" height="5" fill="#4a2b23" opacity="0.32"/>
  <g fill="#c06a3e">
    <rect x="246" y="552" width="9" height="33"/>
    <rect x="496" y="552" width="9" height="33"/>
    <rect x="746" y="552" width="9" height="33"/>
    <rect x="996" y="552" width="9" height="33"/>
  </g>

  <!-- Cron mark: the fixed hour every plate is stamped at. -->
  <g transform="translate(600 648)">
    <circle r="38" fill="none" stroke="#4d6a72" stroke-width="8"/>
    <rect x="-4" y="-24" width="8" height="28" fill="#4d6a72"/>
    <rect x="-4" y="-4" width="21" height="8" fill="#4d6a72"/>
  </g>

  <rect width="1200" height="800" filter="url(#grain)" opacity="0.055" style="mix-blend-mode:multiply"/>
</svg>
